[package]
name = "orbitswap"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
debug = 0
strip = true
codegen-units = 1

[profile.release-with-logs]
inherits = "release"
debug = 1
